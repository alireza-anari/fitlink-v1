services:
  db:
    image: library/postgres@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: fitlink
      POSTGRES_USER: fitlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate local development password}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlink -d fitlink"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: library/redis@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  redis-data:
  db-data:
