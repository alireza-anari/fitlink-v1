name: Task7 PostgreSQL RED diagnostic ONLY - NOT acceptance
'on':
  push:
    branches:
    - diagnostics/c04-task07-red
permissions:
  contents: read
jobs:
  task07-postgresql-red-diagnostic-only:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_DB: fitlink
          POSTGRES_USER: fitlink
          POSTGRES_PASSWORD: ci-migration-only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U fitlink -d fitlink" --health-interval
          3s --health-timeout 3s --health-retries 30
      redis:
        image: redis@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout
          3s --health-retries 30
    env:
      OTP_RATE_REDIS_URL: redis://127.0.0.1:6379/4
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: fitlink
      POSTGRES_USER: fitlink
      POSTGRES_PASSWORD: ci-migration-only
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: 6c66199bd5ea3032d319fa6f727eb1d2e5e6e158
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.19
        python-version: 3.13.15
        enable-cache: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 0a867328a6d8ee8c71ec9bd9eeb8910221d1b270
        path: .runtime/c03
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 0905be6c6ca608d469fe33e87f514b22591132d1
        path: .runtime/c02
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 75c551e5b9bbbfb7777ee52b09a1993b681e921a
        path: .runtime/c01
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 75c551e5b9bbbfb7777ee52b09a1993b681e921a
        path: .runtime/c02/.runtime/c01
        persist-credentials: false
    - run: uv sync --frozen --group dev
    - name: 'Diagnostic only: exact application source'
      run: test "$(git rev-parse HEAD)" = 6c66199bd5ea3032d319fa6f727eb1d2e5e6e158
    - name: 'Diagnostic only: actual PostgreSQL missing-behavior RED'
      run: 'mkdir -p .runtime/task07-red

        timeout -k 10s 300s uv run --frozen python docker/c04_gate.py tests/integration/c04/test_educational_posts.py
        tests/integration/c04/test_post_media.py tests/integration/c04/test_public_moderation.py
        tests/integration/c04/test_post_races.py -q --strict-markers --tb=no --show-capture=no
        > .runtime/task07-red/sanitized.txt'
    - name: 'Diagnostic only: bounded sanitized results'
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: task07-postgresql-red-diagnostic-only
        path: .runtime/task07-red/sanitized.txt
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
