name: C04 Task 7 new-callsites-minimal diagnostic (NOT acceptance)
'on':
  push:
    branches: [diagnostics/c04-task07-new-callsites-minimal]
    paths:
      - .github/workflows/c04-task07-new-callsites-minimal.yml
      - docker/task07_new_callsites_probe.py
      - docker/task07_new_callsites_plugin.py
      - docker/test_task07_new_callsites_harness.py
permissions:
  contents: read
concurrency:
  group: c04-task07-new-callsites-minimal-one-authorized-run
  cancel-in-progress: false
jobs:
  new-callsites-minimal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Start preparation clock
        timeout-minutes: 1
        shell: bash
        run: python -c 'import os,time; open(os.environ["GITHUB_ENV"],"a").write("FITLINK_PREPARATION_START="+str(time.monotonic())+"\n")'
      - name: Checkout diagnostic controls
        timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin Python and uv
        timeout-minutes: 2
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - name: Checkout immutable Task 7
        timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2b2790cdf9019338ddeb09f9df2fdfb1fa0dd331
          path: .runtime/task7-source
          persist-credentials: false
      - name: Verify diagnostic harness
        timeout-minutes: 1
        run: python docker/test_task07_new_callsites_harness.py
      - name: One bounded two-pass diagnostic
        run: python docker/task07_new_callsites_probe.py
      - name: Unconditional owned-resource cleanup and evidence hashes
        if: always()
        run: python docker/task07_new_callsites_probe.py cleanup
      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task07-new-callsites-minimal-${{ github.run_id }}
          path: |
            .runtime/new-callsites-evidence/*.json
            .runtime/new-callsites-evidence/SHA256SUMS.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

