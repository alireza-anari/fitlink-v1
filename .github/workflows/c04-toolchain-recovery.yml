name: Temporary C04 locked toolchain recovery
on:
  push:
    branches: [marketplace/c04-cloud]
    paths: [.github/workflows/c04-toolchain-recovery.yml]
permissions:
  contents: read
jobs:
  recover-locked-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - name: Install only existing locked development dependencies
        run: uv sync --frozen --group dev
      - name: Package only the missing locked Ruff executable
        run: |
          uv run --frozen python - <<'RECOVER_RUFF'
          import hashlib
          import importlib.metadata
          import json
          import pathlib
          import shutil
          import sys
          import sysconfig

          output = pathlib.Path('.runtime/c04-toolchain-recovery')
          output.mkdir(parents=True)
          source = pathlib.Path(sysconfig.get_path('scripts')) / 'ruff'
          assert source.is_file() and not source.is_symlink()
          assert sys.version_info[:3] == (3, 13, 15)
          binary = output / 'ruff'
          shutil.copyfile(source, binary)
          binary.chmod(0o755)
          manifest = {
              'schema': 1,
              'python': '3.13.15',
              'ruff': importlib.metadata.version('ruff'),
              'uv_lock_sha256': hashlib.sha256(pathlib.Path('uv.lock').read_bytes()).hexdigest(),
              'ruff_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'contents': ['ruff'],
              'application_source_included': False,
              'environment_files_included': False,
              'test_inputs_included': False,
              'acceptance_evidence': False,
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Locked Ruff executable packaged; no acceptance claim')
          RECOVER_RUFF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c04-locked-ruff-recovery
          path: .runtime/c04-toolchain-recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
