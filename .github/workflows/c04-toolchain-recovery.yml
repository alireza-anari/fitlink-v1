name: Temporary C04 locked toolchain recovery
on:
  push:
    branches: [marketplace/c04-cloud]
    paths: [.github/workflows/c04-toolchain-recovery.yml]
permissions:
  contents: read
jobs:
  recover-locked-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - name: Install only existing locked development dependencies
        run: uv sync --frozen --group dev
      - name: Package public toolchain without source, environment or test inputs
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import sysconfig
          import tarfile

          output = pathlib.Path('.runtime/c04-toolchain-recovery')
          output.mkdir(parents=True)
          roots = {
              'python': pathlib.Path(sys.base_prefix).resolve(),
              'packages': pathlib.Path(sysconfig.get_path('purelib')).resolve(),
          }
          assert sys.version_info[:3] == (3, 13, 15)
          assert roots['python'] != pathlib.Path('/').resolve()
          assert roots['packages'].is_relative_to(pathlib.Path('.venv').resolve())
          for root in roots.values():
              for path in root.rglob('*'):
                  if path.is_symlink():
                      assert path.resolve().is_relative_to(root)
          archive = output / 'locked-tools.tar.gz'
          with tarfile.open(archive, 'w:gz', dereference=True) as stream:
              for label, root in roots.items():
                  stream.add(root, arcname=label)
          manifest = {
              'schema': 1,
              'python': '3.13.15',
              'uv_lock_sha256': hashlib.sha256(pathlib.Path('uv.lock').read_bytes()).hexdigest(),
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'contents': ['python', 'packages'],
              'application_source_included': False,
              'environment_files_included': False,
              'test_inputs_included': False,
              'acceptance_evidence': False,
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Locked public toolchain packaged; no acceptance claim')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c04-locked-toolchain-recovery
          path: .runtime/c04-toolchain-recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
