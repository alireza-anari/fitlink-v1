name: Task7 C01 C02 prefix observation ONLY - NOT acceptance
on:
  push:
    branches: [diagnostics/c04-task07-foundation]
    paths:
      - .github/workflows/c04-task07-foundation.yml
      - docker/c04_foundation_stage_diagnostic.py
permissions:
  contents: read
  actions: read
jobs:
  foundation-diagnostic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6c66199bd5ea3032d319fa6f727eb1d2e5e6e158
          path: .runtime/source
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .runtime/source/.node-version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 75c551e5b9bbbfb7777ee52b09a1993b681e921a
          path: .runtime/source/.runtime/c01
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0905be6c6ca608d469fe33e87f514b22591132d1
          path: .runtime/source/.runtime/c02
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0a867328a6d8ee8c71ec9bd9eeb8910221d1b270
          path: .runtime/source/.runtime/c03
          persist-credentials: false
      - name: Observer redaction exit status and boundedness self-tests
        run: python docker/test_c04_foundation_stage_diagnostic.py
      - name: Exact fixtures and original frozen preconditions
        working-directory: .runtime/source
        run: python "$GITHUB_WORKSPACE/docker/c04_foundation_stage_diagnostic.py" prepare
      - name: ONE byte-identical C01 C02 prefix with private stage observation
        working-directory: .runtime/source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/docker/c04_foundation_stage_diagnostic.py"
      - name: Diagnostic ONLY finite stage evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task07-foundation-prefix-observation-only
          path: |
            .runtime/source/.runtime/foundation-stage-diagnostic/preparation.jsonl
            .runtime/source/.runtime/foundation-stage-diagnostic/result.json
            .runtime/source/.runtime/foundation-stage-diagnostic/stages.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Re-download uploaded ZIP and verify its exact digest
        if: always() && steps.evidence.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIAGNOSTIC_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          DIAGNOSTIC_ARTIFACT_SHA256: ${{ steps.evidence.outputs.artifact-digest }}
        run: python docker/c04_foundation_stage_diagnostic.py verify-upload
