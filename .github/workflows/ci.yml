name: C02 Accounts and Foundation regression
on:
  push:
    branches: [accounts/c02-cloud, profiles/c03-cloud]
permissions:
  contents: read
concurrency:
  group: c02-accounts-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - name: Immutable completed C01 fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 75c551e5b9bbbfb7777ee52b09a1993b681e921a
          path: .runtime/c01
          persist-credentials: false
      - name: Verify exact C01 source tree before use
        run: python docker/c02_baseline.py .runtime/c01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Frozen dependency checks
        run: |
          uv lock --check
          uv sync --frozen --group dev
          npm ci
      - name: Tailwind, ES module, hashed static build
        run: |
          npm run build:css
          npm run check:js
          test -s static/dist/app.css
          uv run --frozen python manage.py collectstatic --noinput --settings=config.settings.build --ignore=src/styles.css
          test -s staticfiles/staticfiles.json
      - name: Ruff, format, mypy, Django, unit and production checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy config/settings/env.py config/health.py apps/assets/storage.py apps/accounts apps/governance config/use_cases config/account_middleware.py config/authentication.py config/permissions.py
          uv run --frozen python manage.py check --settings=config.settings.test
          uv run --frozen pytest tests/unit -q --strict-markers
          uv run --frozen python docker/production_check.py
      - name: Exact C01 upgrade and complete isolated C02 regression
        run: sh docker/verify_c02.sh
  c02-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_DB: fitlink
          POSTGRES_USER: fitlink
          POSTGRES_PASSWORD: ci-migration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fitlink -d fitlink"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      OTP_RATE_REDIS_URL: 'redis://127.0.0.1:6379/4'
      CELERY_BROKER_URL: 'redis://127.0.0.1:6379/1'
      CELERY_RESULT_BACKEND: 'redis://127.0.0.1:6379/2'
      POSTGRES_HOST: '127.0.0.1'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: fitlink
      POSTGRES_USER: fitlink
      POSTGRES_PASSWORD: ci-migration-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - name: Frozen migration environment
        run: uv sync --frozen --group dev
      - name: Inspect additive migration SQL
        run: |
          uv run --frozen python manage.py sqlmigrate accounts 0002 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0004 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0005 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0006 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0007 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0008 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0009 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0010 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0011 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0012 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0013 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0002 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0003 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0004 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0005 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0006 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0007 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0008 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0009 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0010 --settings=config.settings.test
      - name: Real PostgreSQL account upgrade and constraint contracts
        run: uv run --frozen pytest tests/integration/c02 tests/integration/test_initial_migration.py -q --strict-markers

      - name: Real Redis restart and lost-counter durable quota gate
        env:
          C02_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          uv run --frozen python manage.py migrate --noinput --settings=config.settings.test
          uv run --frozen python docker/c02_limiter_restart_probe.py prepare
          docker restart "$C02_REDIS_CONTAINER"
          for probe in $(seq 1 30); do
            if docker exec "$C02_REDIS_CONTAINER" redis-cli ping >/dev/null; then break; fi
            sleep 1
          done
          docker exec "$C02_REDIS_CONTAINER" redis-cli ping
          uv run --frozen python docker/c02_limiter_restart_probe.py verify
      - name: C03 cumulative installed PostgreSQL contracts
        if: github.ref == 'refs/heads/profiles/c03-cloud'
        run: sh docker/verify_c03_incremental.sh
  c03-storage:
    if: github.ref == 'refs/heads/profiles/c03-cloud'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - name: Frozen private storage gate environment
        run: uv sync --frozen --group dev
      - name: C03 real private MinIO and owned upload contracts
        run: sh docker/verify_c03_storage.sh
