name: C02 Accounts and Foundation regression
on:
  push:
    branches: [accounts/c02-cloud]
permissions:
  contents: read
concurrency:
  group: c02-accounts-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Frozen dependency checks
        run: |
          uv lock --check
          uv sync --frozen --group dev
          npm ci
      - name: Tailwind, ES module, hashed static build
        run: |
          npm run build:css
          npm run check:js
          test -s static/dist/app.css
          uv run --frozen python manage.py collectstatic --noinput --settings=config.settings.build --ignore=src/styles.css
          test -s staticfiles/staticfiles.json
      - name: Ruff, format, mypy, Django, unit and production checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy config/settings/env.py config/health.py apps/assets/storage.py apps/accounts apps/governance
          uv run --frozen python manage.py check --settings=config.settings.test
          uv run --frozen pytest tests/unit -q --strict-markers
          uv run --frozen python docker/production_check.py
      - name: Clean isolated Compose integration and Playwright rehearsal
        run: sh docker/verify_foundation.sh
  c02-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_DB: fitlink
          POSTGRES_USER: fitlink
          POSTGRES_PASSWORD: ci-migration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fitlink -d fitlink"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      OTP_RATE_REDIS_URL: 'redis://127.0.0.1:6379/4'
      POSTGRES_HOST: '127.0.0.1'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: fitlink
      POSTGRES_USER: fitlink
      POSTGRES_PASSWORD: ci-migration-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - name: Frozen migration environment
        run: uv sync --frozen --group dev
      - name: Inspect additive migration SQL
        run: |
          uv run --frozen python manage.py sqlmigrate accounts 0002 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0004 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate accounts 0005 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0002 --settings=config.settings.test
          uv run --frozen python manage.py sqlmigrate governance 0003 --settings=config.settings.test
      - name: Real PostgreSQL account upgrade and constraint contracts
        run: uv run --frozen pytest tests/integration/c02 tests/integration/test_initial_migration.py -q --strict-markers
