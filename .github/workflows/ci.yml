name: C01 Foundation
on:
  push:
    branches: [foundation/c01-cloud]
permissions:
  contents: read
concurrency:
  group: c01-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.19'
          python-version: '3.13.15'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Frozen dependency checks
        run: |
          uv lock --check
          uv sync --frozen --group dev
          npm ci
      - name: Tailwind, ES module, hashed static build
        run: |
          npm run build:css
          npm run check:js
          test -s static/dist/app.css
          uv run --frozen python manage.py collectstatic --noinput --settings=config.settings.build --ignore=src/styles.css
          test -s staticfiles/staticfiles.json
      - name: Ruff, format, mypy, Django, unit and production checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy config/settings/env.py config/health.py apps/assets/storage.py
          uv run --frozen python manage.py check --settings=config.settings.test
          uv run --frozen pytest tests/unit -q --strict-markers
          uv run --frozen python docker/production_check.py
      - name: Clean isolated Compose integration and Playwright rehearsal
        run: sh docker/verify_foundation.sh
