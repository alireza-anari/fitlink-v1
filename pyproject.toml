[project]
name = "fitlink"
version = "0.1.0"
description = "FitLink C01 infrastructure foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<8",
  "celery[redis]>=5.5,<6",
  "channels>=4.2,<5",
  "channels-redis>=4.2,<5",
  "uvicorn[standard]>=0.34,<1",
  "django-storages[s3]>=1.14,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4.9,<5",
  "pytest-asyncio>=0.24,<2",
  "playwright>=1.50,<2",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "django-stubs>=5.2,<5.3",
  "httpx>=0.28,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["tests/unit"]
addopts = "--ds=config.settings.test"
asyncio_mode = "auto"
markers = [
  "unit: tests without infrastructure services",
  "integration: local PostgreSQL, Redis or MinIO tests",
  "e2e: browser smoke tests",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
